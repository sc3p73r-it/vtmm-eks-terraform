name: Terraform - Plan (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev, uat, prod)'
        required: true
        type: string
      backend_file:
        description: 'Path to backend config file for the environment'
        required: true
        type: string
      tfvars_file:
        description: 'Path to tfvars file for the environment'
        required: true
        type: string
    secrets:
      aws_oidc_role_arn:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: plan-${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_oidc_role_arn }}
          aws-region: ap-southeast-1
          role-session-name: gh-${{ inputs.environment }}-plan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        run: terraform fmt -recursive -check

      - name: Terraform Init
        run: terraform init -input=false -backend-config=${{ inputs.backend_file }}

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -var-file=${{ inputs.tfvars_file }} -out=tfplan | tee /tmp/terraform_plan.out
        continue-on-error: true

      # Post the plan as a PR comment using the saved plan file output
      - name: Update PR With Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          WF: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          script: |
            const fs = require('fs');
            let planText = 'Plan output not available. See run: ' + process.env.WF;
            if (fs.existsSync('/tmp/terraform_plan.out')) {
              planText = fs.readFileSync('/tmp/terraform_plan.out', 'utf8');
            }
            const output = `## Terraform Plan · \`${{ inputs.environment }}\`

            \`\`\`diff
            ${planText}
            \`\`\`

            ▶️ [View Run](${process.env.WF})
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1